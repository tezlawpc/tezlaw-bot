name: CI

# Render's deploy trigger for this service is "After CI Checks Pass". Before
# this workflow existed the repo had no push-triggered checks at all, so a push
# produced zero check runs and Render sat waiting for a result that was never
# coming — which is why commits stopped deploying. This gives it a real check
# to wait on, and the deploy fires as soon as this job goes green.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Syntax + regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Cheapest check, so it runs first. A file uploaded through the GitHub
      # website lands at the top of the repo, where its require("../x") resolves
      # outside the repo and npm never runs it -- so the script looks present and
      # is in fact dead. This also catches a file left at both ./ and scripts/,
      # where one copy is silently stale.
      - name: Repo layout
        run: node scripts/check-repo-layout.js

      # Every .js file must parse. A syntax error anywhere takes the whole
      # server down at boot, after the deploy has already swapped instances.
      - name: Syntax
        run: node scripts/check-syntax.js

      # Admin pages that still emit inline <script> are rendered and the script
      # the browser would actually receive is parsed. Catches the server-side
      # template-literal trap, where \n and \' are consumed before the browser
      # sees them and the whole block dies.
      - name: Inline admin scripts
        run: node scripts/check-inline-scripts.js

      # Every /api/staff/civil/* route must still have its /admin/civil/api/*
      # twin on the same handler, so the iOS app and the web admin cannot drift.
      - name: Civil app/web API parity
        run: node scripts/check-civil-parity.js

      # The multi-jurisdiction deadline engine computes real filing deadlines.
      # Pins the day counts, the service-method extensions (federal e-service
      # adds nothing; Georgia adds three), the weekend and holiday rolls, and
      # Texas's Monday snap.
      - name: Jurisdiction deadline engine
        run: node scripts/check-jurisdictions.js

      # UTBMS code sets, LEDES 1998B output, the phase task templates and the
      # document-to-phase routing.
      - name: UTBMS and phase playbooks
        run: node scripts/check-utbms-phases.js

      # The stage playbook must cover all nine stages, reference only real CCP
      # rule keys, and raise the right warnings (missing SOL, unserved filing,
      # no trial date in trial prep, and so on).
      - name: Civil stage workspaces
        run: node scripts/check-stage-workspace.js

      # Loads the real public/civil-admin.js into jsdom against the real page
      # HTML: panels must render, and every form must post the exact field
      # names the civil-* modules destructure.
      - name: Civil admin UI
        run: node scripts/check-civil-admin-ui.js

      - name: Civil stage page
        run: node scripts/check-stage-page.js

      # The Zara ops panel sits behind a legacy Telegram-session guard. It must
      # also accept the main admin session — without that, /panel.js serves
      # HTML and every /admin/api/* call 401s — while still refusing everyone
      # who is not an admin.
      - name: Admin panel auth
        run: node scripts/check-admin-auth.js

      # /admin/panel/:tab embeds the ops panel. The embed route must be matched
      # before the :tab route and must render with its own chrome suppressed,
      # or the whole admin UI renders inside itself.
      - name: Admin panel embed
        run: node scripts/check-panel-embed.js

      # Zara's charter is editable from a web page, so the guarantees that
      # make that safe have to be enforced in code: the boundaries reach
      # every prompt on every surface and no charter edit can weaken them;
      # a lesson needs a human before it reaches a prompt; a tool-using call
      # never silently degrades to a provider that cannot run the tools;
      # and she still answers with the database down.
      - name: Zara core
        run: node scripts/check-zara-core.js

      # The charter console is the only place Zara can be changed. Loads the
      # real public/zara-admin.js into jsdom against the real page markup:
      # the panels must draw, the boundaries must render read-only, and the
      # save button must post the exact shape the PUT handler destructures.
      - name: Zara admin UI
        run: node scripts/check-zara-admin-ui.js

      # The public contact form shipped once complete, tested and unmounted:
      # the file was in the repo, the form was on the site, and every intake
      # went nowhere. This asserts server.js still mounts it, and exercises
      # the honeypot, the field validation and the flood limit.
      - name: Public intake form
        run: node scripts/check-web-intake.js

      - name: Lead sources
        run: node scripts/check-lead-sources.js

      - name: Ops group rules
        run: node scripts/check-ops-chat.js

      # A notice in the wrong topic is a notice somebody did not read. The
      # court sorter, and its fallback while a topic does not exist yet.
      - name: Court topics
        run: node scripts/check-court-topics.js

      # An answer in the ops group is read by everyone in it. Who is answered,
      # what she may look up there, and what never leaves.
      - name: Ask Zara in the ops group
        run: node scripts/check-ask-zara.js

      # Explainer videos: a video per language, what the voice is given to
      # read, and what happens when a line does not come back as written.
      - name: Video voice, three languages
        run: node scripts/check-video-voice.js

      # The advertising rules: what posts, cards, videos, follow-up texts and
      # the site cleanup may and may not say.
      - name: Advertising rules
        run: node scripts/check-ad-rules.js

      # Zara on the phone: office-hours transfers, after-hours leads and
      # messages, the webhook signature, and what she is told to say.
      - name: Phone receptionist
        run: node scripts/check-voice-rt.js

      # A document uploaded for signature: the fields a signer fills must land
      # where staff placed them, on rotated and cropped pages too, and nobody
      # outside the client's team may open the packet.
      - name: E-sign, uploaded documents
        run: node scripts/check-esign-upload.js

      # The Matter Manager lives inside Tara. Its old addresses must keep
      # working (reminder emails link to them) and it must stay admin-only.
      - name: Matter Manager in Tara
        run: node scripts/check-matters-in-tara.js

      # The admin pages in the firm's colours, and readable: no white words on
      # Seal Orange, no colour of the old palettes written back in by hand.
      - name: Brand pass
        run: node scripts/check-brand-pass.js

      # Every link the court calendar emits, checked against the route table
      # read out of server.js. Three of its five destinations were paths that
      # had never existed, so clicking a merits hearing or an EOIR notice
      # returned "Cannot GET" -- and the month grid was not clickable at all.
      - name: Calendar links
        run: node scripts/check-calendar-links.js

      # More than one calendar can be subscribed to. The unique index moved to
      # (feed_id, ical_uid); if the insert's ON CONFLICT target drifts from it,
      # every hourly sync re-inserts every event instead of updating it and the
      # calendar fills with duplicates overnight.
      - name: Calendar feeds
        run: node scripts/check-calendar-feeds.js

      # A page's script must never be replaced by a server file of the same
      # name. calendar-feeds.js is both, and the boot-time rescue of misplaced
      # uploads copied the server module over the page's script on every start.
      - name: Bundle names
        run: node scripts/check-bundle-names.js

      # Court mail that cannot be understood must still reach a person. A
      # pre-hearing order from an immigration judge became "Error: Zara did
      # not return JSON" and stopped there, because an empty model answer
      # and malformed JSON were reported as the same thing.
      - name: Court mail reading
        run: node scripts/check-court-mail-reading.js

      # Client trust money. The staff app computes each running balance from
      # ORDER BY id DESC -- insertion order, not transaction date -- so a
      # back-dated withdrawal can pass the overdraft guard and still leave a
      # past day below zero. RRC 1.15 does not allow that to go unseen.
      - name: Trust ledger
        run: node scripts/check-trust-ledger.js

      # The firm's books live in QuickBooks, and these pages show its own
      # reports rather than a ledger rebuilt here. That makes the report
      # parser load-bearing: a cent lost to floating point on every line, or
      # a total read from the wrong column, both foot to something plausible.
      - name: QuickBooks reports
        run: node scripts/check-qbo-reports.js

      # Every accounting page read 0.00 for months -- not because the firm
      # earned nothing, but because the pages read local tables nobody fills
      # while the books sat in QuickBooks. A zero on an income statement
      # reads as a fact about the firm. So: no connection, a sandbox realm,
      # a dead token, an unreadable report and an empty period must each SAY
      # so, and none of them may render a dollar amount.
      - name: QuickBooks panel
        run: node scripts/check-qbo-panel.js

      # A mistyped or stale admin URL used to land on express
      # \"Cannot GET /x\". /admin/trust is the Tara app path for the
      # trust page; this server calls it /admin/accounting/trust.
      - name: Admin 404 and path aliases
        run: node scripts/check-admin-404.js

      # A reminder said 12:00 PM for a 9:00 AM custody hearing: both
      # message builders formatted a noon-UTC placeholder and never read
      # hearing_time_text. Times are quoted from the notice now.
      - name: Hearing time quoted, never computed
        run: node scripts/check-hearing-when.js

      # The same hearing in two Dropbox folders was two files, so it became
      # two hearings on the calendar and two reminders to the client. The
      # table dedupes files; it has to dedupe hearings too.
      - name: One hearing, one row
        run: node scripts/check-hearing-dedup.js

      # Clicking Consultant Tasks in the admin sidebar used to land in what
      # looked like a different application: that page rendered its own
      # chrome. It renders in the admin chrome now and borrows tez-theme's
      # components, scoped so they cannot restyle the rest of admin.
      - name: Consultant tasks is an admin page
        run: node scripts/check-consultant-page.js

      # The conflict check searched `clients` and `intakes` only, so it never
      # read an opposing party and could report "cleared" on a name the firm
      # had been directly opposite. Rule 1.7 and 1.9 turn on those names.
      - name: Conflict checks read the other side
        run: node scripts/check-conflicts.js

      # One generator now writes every fee agreement the firm signs, so a
      # clause that is wrong is wrong on all of them. § 6148 and § 6147 make
      # an agreement voidable without their required terms, and rule 1.5(d)
      # forbids calling a fee earned-on-receipt.
      - name: Fee agreements carry what the statutes require
        run: node scripts/check-retainer.js

      # This writes to a live litigation record from a machine's reading of a
      # PDF, so what it refuses to do is the whole feature: a field that
      # already has a value is never proposed, a value it cannot quote is
      # dropped, a field filled in since the read is skipped rather than
      # overwritten, and only a column on that matter kind's own list can be
      # written at all. The statute of limitations is on no list.
      - name: Reading a case file never overwrites one
        run: node scripts/check-case-autofill.js

      # Every check here that touches the database stubs db.query, so none of
      # them can catch a SQL typing error -- the stub accepts any statement.
      # The merge button on the duplicate-hearings page was refused by
      # Postgres on every click because one parameter was an integer in one
      # clause and a string in another. This reads the SQL as text.
      - name: Query parameters carry their type
        run: node scripts/check-sql-params.js

      # Clicking an EOIR notice on the calendar opened the JSON API the app
      # reads, so the browser printed the raw response. Three other links on
      # that calendar went nowhere before this one. Also guards the hearing
      # time: a notice parsed to "13:00" was refused for having no am/pm and
      # the client was told the time was not confirmed.
      - name: A calendar click opens a page, and quotes the time on the notice
        run: node scripts/check-notice-page.js

      # Sending an agreement files it on the client, opens a case and raises
      # an invoice. Also guards the scope writer: the scope is the firm's
      # contractual promise, so an expansion that adds a filing or promises
      # a result is refused rather than signed.
      - name: An agreement that goes out files itself, and Zara never adds work
        run: node scripts/check-retainer-handoff.js

      # Every message an Immigration Court client gets, and when. These go
      # to people in removal proceedings about dates that decide whether
      # they stay, so the guards are mostly about what the messages must
      # not say: a time that was not on the notice, a filing deadline the
      # judge did not set, or an explanation of voluntary departure.
      - name: The EOIR reminder schedule says only what the notice says
        run: node scripts/check-reminder-schedule.js

      # USCIS publishes no forms API, so the edition date is read off each
      # form PDF and the Federal Register is the daily signal. Most of this
      # guards the matcher: the Register titles its notices with the form's
      # NAME, and two forms can be one word apart.
      - name: USCIS form editions, and the matcher that spots a change
        run: node scripts/check-uscis-forms.js

      # The two "+ New Hearing" buttons on a client profile carried
      # prefill_a and prefill_name for months and neither route read them.
      # Half of this check is the other half of the job: a new hearing note
      # takes the client's details and none of the hearing's own facts.
      - name: A new hearing note pulls the client, not the hearing
        run: node scripts/check-hearing-prefill.js

      # The G-28 goes on every USCIS filing and its field names do not match
      # the printed page: two of them are backwards, so the box named
      # Line6_EMail is the mobile telephone box. The map is pinned to each
      # field's printed label, and this is what re-checks it.
      - name: The G-28 field map still matches the printed form
        run: node scripts/check-uscis-g28.js

      # Most filings are several forms signed by different people. The
      # error this guards is the one that looks like helpfulness:
      # multiplying a package by family size in a category that has no
      # derivatives, which produces a package that cannot be filed.
      - name: Combo filings list the right forms for the right people
        run: node scripts/check-uscis-packages.js

      # The Word file and the browser copy disagreed about where the firm
      # profile goes and whether the body is justified, and a print button
      # that was a javascript: URL gave Safari a blank page.
      - name: The Word file and the print view agree with each other
        run: node scripts/check-agreement-export.js

      - name: Hearing notices state the date on the notice
        run: node scripts/check-notice-when.js

      - name: A client profile can correct what it shows
        run: node scripts/check-client-edit.js

      - name: A single USCIS form is answered as questions
        run: node scripts/check-uscis-questionnaire.js

      - name: Calendar entries can be added, changed and deleted
        run: node scripts/check-firm-events.js

      # An empty trust ledger satisfies bank-minus-clients exactly, so the
      # dashboard reported "IOLTA TRUST $0.00 ✓ Reconciled" for an account
      # it had never seen a transaction for. RRC 1.15 is the rule the State Bar
      # takes licences over; this is the one claim that may not be made
      # without evidence behind it.
      - name: Trust reconciliation claim
        run: node scripts/check-trust-reconciled-claim.js

      # Signed client documents were being delivered to a personal Hotmail
      # address, and signers were told that every other party had signed.
      # Two letters, two audiences, and the firm copy at a firm address.
      - name: Signed-copy delivery
        run: node scripts/check-esign-copies.js

      # A stalled matter does not announce itself: it stops appearing in
      # anybody day. The board showed last-updated, which any field edit
      # moves, so it answered a different question from the one being asked.
      - name: Civil board staleness
        run: node scripts/check-civil-staleness.js

      # Court mail put hearings on the calendar and never took one off, so a
      # continuance produced half an update: the new date went on and the old
      # one stayed. A hearing nobody is going to hides the one that matters.
      - name: "Court mail: hearings off calendar"
        run: node scripts/check-court-mail-vacate.js

      # One address holding every court notice, with the deadline reading
      # attached. The guard that matters: copying to the mailbox being read
      # would forward every message to itself, forever.
      - name: "Court mail: the docket mailbox"
        run: node scripts/check-court-mail-docket.js

      # Client trust is recorded in two tables that have never been joined.
      # Both figures are shown side by side; merging them means deciding which
      # rows are the same transaction twice, which is an attorney judgement.
      - name: "Trust: both figures"
        run: node scripts/check-trust-both-figures.js

      # Record Fee and Record Retainer slugified a typed name into the client
      # key the entry — and a retainers trust ledger — was filed under. And
      # Sync from PI selected a pi_cases column that does not exist.
      - name: "Accounting entries: client and columns"
        run: node scripts/check-accounting-entry.js

      # All three export buttons read this apps own journal, which is empty,
      # so each handed back a file with headers and no rows. A workbook of
      # zeros is what goes to an accountant.
      - name: Accounting exports
        run: node scripts/check-accounting-export.js

      # ── The real server against a real database ──────────────────────
      # Every check above stubs Postgres. That is how "column t.completed
      # does not exist" reached a consultant's screen: the query had never
      # been sent to a database before it shipped. This starts the runner's
      # own Postgres, boots server.js on it twice, signs in as each kind of
      # user, walks every page and API route it can reach, and fails on any
      # query the database rejects that is not already listed in
      # scripts/dbcheck-known.json.
      #
      # If the database cannot be started, or the server will not boot here,
      # the check says "did not run" as a warning on the run and does NOT
      # block the deploy — only a real, new schema error does.
      - name: Start a scratch Postgres
        continue-on-error: true
        run: |
          sudo systemctl start postgresql.service
          pg_isready --timeout=30
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "CREATE USER tez WITH PASSWORD 'tez'" \
            -c "CREATE DATABASE tez_dbcheck OWNER tez"
          # server.js always asks Postgres for SSL (Render requires it), so
          # the scratch database has to offer it.
          if [ "$(sudo -u postgres psql -Atc 'SHOW ssl')" != "on" ]; then
            sudo apt-get install -y ssl-cert > /dev/null
            sudo make-ssl-cert generate-default-snakeoil || true
            sudo usermod -aG ssl-cert postgres
            sudo -u postgres psql \
              -c "ALTER SYSTEM SET ssl = on" \
              -c "ALTER SYSTEM SET ssl_cert_file = '/etc/ssl/certs/ssl-cert-snakeoil.pem'" \
              -c "ALTER SYSTEM SET ssl_key_file = '/etc/ssl/private/ssl-cert-snakeoil.key'"
            sudo systemctl restart postgresql.service
            pg_isready --timeout=30
          fi

      - name: Database check
        timeout-minutes: 10
        run: node scripts/dbcheck.js

      # Zara, end to end: the real server on the same scratch database, asked
      # the questions staff ask in the ops group and in the app, with a
      # calendar in the database. It reads what her look-ups were given.
      # Telegram is recorded, the model is stood in for, and nothing can
      # leave the build machine. Like the database check, if it cannot run
      # at all it warns and does not block the deploy; a wrong answer does.
      - name: Zara answers, end to end
        timeout-minutes: 8
        run: node scripts/e2e.js
